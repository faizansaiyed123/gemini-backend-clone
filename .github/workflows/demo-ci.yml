name: Gemini backend demo CI

on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]

permissions:
  contents: read

jobs:
  demo-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out demo branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install demo test dependencies
        run: python -m pip install --upgrade pip fastapi==0.115.11 httpx==0.28.1 pytest==8.4.1
      - name: Compile isolated demo API
        run: python -m py_compile app/demo_api.py
      - name: Run isolated demo API tests
        env:
          PYTHONPATH: .
        run: pytest -q demo_tests
